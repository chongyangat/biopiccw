[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biopiccw"
version = "0.1.0"
description = "Visual-aid rendering pipeline simulation in Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "opencv-python",
  "scikit-image",
]

[project.scripts]
biopiccw-render = "biopiccw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
